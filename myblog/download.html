<style>

</style></head><body>
<nav class="nav"><div class="container nav-inner"><a class="brand" href="index.html" data-zh="Alen 的博客" data-en="Alen’s Blog">Alen 的<span>博客</span></a><div class="nav-links"><a href="index.html#posts" data-zh="博客" data-en="Blog">博客</a><a href="index.html#about" data-zh="关于" data-en="About">关于</a><a href="index.html#projects" data-zh="项目" data-en="Projects">项目</a><a href="index.html#contact" data-zh="联系" data-en="Contact">联系</a><a href="downloads.html" data-zh="资源下载" data-en="Downloads">资源下载</a><button id="themeToggle">浅色</button><button id="languageToggle">EN</button></div></div></nav>
<main class="container"><header class="hero"><div class="eyebrow" data-zh="资源中心" data-en="Resource library">资源中心</div><h1 data-zh="资源下载" data-en="Downloads">资源下载</h1><p data-zh="这里会整理我在博客文章和项目中分享的文件、工具与资料。" data-en="Files, tools, and materials shared through my posts and projects will be collected here.">这里会整理我在博客文章和项目中分享的文件、工具与资料。</p></header><section class="card"><h2 data-zh="暂时还没有可下载的资源" data-en="No downloads yet">暂时还没有可下载的资源</h2><p class="empty" data-zh="有新的资料发布时，我会在这里添加说明和下载链接。" data-en="When new materials are available, I will add their descriptions and download links here.">有新的资料发布时，我会在这里添加说明和下载链接。</p><a class="back" href="index.html" data-zh="← 返回博客首页" data-en="← Back to the blog">← 返回博客首页</a></section></main>
<script>
const root=document.documentElement,themeToggle=document.getElementById('themeToggle'),languageToggle=document.getElementById('languageToggle');let language=localStorage.getItem('language')||'zh';const savedTheme=localStorage.getItem('theme');if(savedTheme)root.dataset.theme=savedTheme;function update(){document.documentElement.lang=language==='en'?'en':'zh-CN';document.title=language==='en'?'Downloads | Alen’s Blog':'资源下载 | Alen 的博客';document.querySelectorAll('[data-zh][data-en]').forEach(el=>el.textContent=language==='en'?el.dataset.en:el.dataset.zh);languageToggle.textContent=language==='zh'?'EN':'中文';themeToggle.textContent=language==='zh'?(root.dataset.theme==='dark'?'浅色':'深色'):(root.dataset.theme==='dark'?'Light':'Dark')}themeToggle.addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem('theme',root.dataset.theme);update()});languageToggle.addEventListener('click',()=>{language=language==='zh'?'en':'zh';localStorage.setItem('language',language);update()});update();
</script></body></html>
